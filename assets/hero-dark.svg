<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-label="Ali Tamimi — frontend and full-stack engineer, Amman Jordan">
  <title>Ali Tamimi — frontend &amp; full-stack</title>
  <defs>
    <clipPath id="card"><rect width="1000" height="340" rx="18"/></clipPath>

    <!-- The field. Blurred cerulean masses, drifting. Same idea as the app's
         brand-moment ground: colour you feel before you read anything. -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- The sweep. The chat's thinking-line recipe: the base ink is near-white
         and one bright band travels through it. 5s linear, the speed Ali kept. -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0">
      <stop offset="0"    stop-color="#f1f3f4"/>
      <stop offset="0.40" stop-color="#f1f3f4"/>
      <stop offset="0.50" stop-color="#64d6f2"/>
      <stop offset="0.60" stop-color="#f1f3f4"/>
      <stop offset="1"    stop-color="#f1f3f4"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="-420 0" to="1120 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#039bb9" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#039bb9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="#121517"/>

    <g filter="url(#soft)" opacity="0.72">
      <circle cx="815" cy="70" r="150" fill="#039bb9">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -50 45; 30 -25; 0 0" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="290" r="130" fill="#039bb9" opacity="0.75">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 35 -55; -45 20; 0 0" dur="32s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="330" r="110" fill="#00343f">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 60 -30; -20 -50; 0 0" dur="38s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- A whisper of grain so the gradient never bands on a wide monitor. -->
    <rect width="1000" height="340" fill="#121517" opacity="0.06"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="339" rx="18" fill="none" stroke="#2a2e31"/>

  <!-- Identity -->
  <text x="64" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="56" font-weight="700" letter-spacing="7" fill="url(#sweep)">ALI TAMIMI</text>

  <rect x="66" y="144" width="300" height="2" rx="1" fill="url(#rule)"/>

  <text x="66" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="17" fill="#9fa4a7">I build interfaces that carry weight.</text>

  <!-- Stack -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5">
    <g transform="translate(66 228)">
      <path d="M0 -4 L5 1 L0 6 L-5 1 Z" fill="#039bb9"/>
      <text x="18" y="5" fill="#707579" letter-spacing="1.6" font-size="11.5" font-weight="600">FRONTEND</text>
      <text x="128" y="5" fill="#f1f3f4">Next.js 16 · React · Tailwind v4 · TypeScript</text>
    </g>
    <g transform="translate(66 264)">
      <path d="M0 -4 L5 1 L0 6 L-5 1 Z" fill="#039bb9"/>
      <text x="18" y="5" fill="#707579" letter-spacing="1.6" font-size="11.5" font-weight="600">BACKEND</text>
      <text x="128" y="5" fill="#f1f3f4">FastAPI · PostgreSQL · Docker · Redis</text>
    </g>
    <g transform="translate(66 300)">
      <path d="M0 -4 L5 1 L0 6 L-5 1 Z" fill="#039bb9"/>
      <text x="18" y="5" fill="#707579" letter-spacing="1.6" font-size="11.5" font-weight="600">SHIPPING</text>
      <text x="128" y="5" fill="#f1f3f4">Khayarak · VOC360 · Rased · FortiLink</text>
    </g>
  </g>

  <!-- Location, with a live dot -->
  <g transform="translate(872 52)">
    <circle cx="0" cy="-4" r="4" fill="#20ac88">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
          font-size="11.5" letter-spacing="1.6" font-weight="600" fill="#9fa4a7">AMMAN, JO</text>
  </g>
</svg>
