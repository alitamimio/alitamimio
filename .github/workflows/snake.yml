name: snake

# The contribution graph, eaten. Rendered in the card's greys rather than the
# default green, so it reads as part of the page instead of bolted onto it:
# off-white on GitHub's dark page, black on the light one. Output goes to its
# own branch, keeping generated art out of main.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23ededed&color_dots=%23161616,%233a3a3a,%23676767,%23a3a3a,%23ededed
            dist/snake-light.svg?color_snake=%230a0a0a&color_dots=%23ebebeb,%23c4c4c4,%238f8f8f,%23555555,%230a0a0a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
