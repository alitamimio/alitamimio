name: snake

# The contribution graph, eaten. Rendered in the card's own cerulean rather
# than the default green so it reads as part of the page instead of bolted
# onto it. Output goes to its own branch, keeping generated art out of main.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23039bb9&color_dots=%231e2224,%2300343f,%23027c93,%23039bb9,%2364d6f2
            dist/snake-light.svg?color_snake=%23027c93&color_dots=%23e7ebef,%23a8e7f6,%2364d6f2,%2300b7d9,%23027c93

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
